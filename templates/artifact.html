<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="referrer" content="no-referrer">
  <title>AVA 分析报告</title>
  <style>
    :root { --ink:#171717; --muted:#737373; --line:#e5e5e5; --mono:"SFMono-Regular",Consolas,monospace; }
    * { box-sizing:border-box; }
    html { scroll-behavior:auto; scroll-padding-top:16px; }
    body { margin:0; background:#f5f5f5; color:var(--ink); font:13px/1.7 "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif; -webkit-font-smoothing:antialiased; }
    button { font:inherit; cursor:pointer; }
    a { color:inherit; text-decoration:none; }
    button:focus-visible,a:focus-visible,summary:focus-visible,[tabindex]:focus-visible { outline:2px solid #737373; outline-offset:3px; }
    .skip { position:absolute; top:-60px; left:16px; background:white; padding:8px; z-index:3; }.skip:focus { top:8px; }
    button { border:1px solid #dedede; background:#fff; color:#525252; border-radius:5px; padding:4px 9px; font-size:10px; }
    button:hover { background:#f0f0f0; border-color:#bdbdbd; color:#171717; }
    main { max-width:1104px; margin:20px auto 32px; border:1px solid #dedede; background:#fff; box-shadow:0 2px 6px #00000003; }
    .report-intro { padding:24px 28px 18px; }
    h1 { margin:0 0 6px; font-size:23px; line-height:1.5; font-weight:600; letter-spacing:-.5px; overflow-wrap:anywhere; }
    .summary,.conclusion { white-space:pre-line; }
    .summary { margin:0; color:#525252; font-size:12px; line-height:1.85; }
    .meta { margin:10px 0 0; color:#737373; font-size:10px; }
    .overview { margin:0 28px; padding:0 0 16px; border-bottom:1px solid var(--line); }
    .metrics { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); border:1px solid var(--line); border-radius:6px; background:#fafafa; }
    .metric { min-width:0; padding:12px 18px; border-right:1px solid var(--line); }.metric:last-child { border-right:0; }
    .metric-label { color:#737373; font-size:10px; }
    .metric-value { font-size:25px; font-weight:550; letter-spacing:-.6px; line-height:1.6; font-variant-numeric:tabular-nums; }
    .metric-unit { color:#737373; font-size:10px; font-weight:400; margin-left:5px; letter-spacing:0; }
    .metric-note { display:none; }
    .report-index { display:flex; align-items:flex-start; gap:12px; margin-top:12px; }.metrics[hidden]+.report-index { margin-top:0; }
    .index-label { flex-shrink:0; padding-top:2px; font-size:10px; color:#737373; }
    .question-index { display:flex; flex-wrap:wrap; gap:3px 14px; margin:0; padding:0; list-style:none; min-width:0; }
    .question-index li { margin:0; min-width:0; max-width:100%; }
    .question-index a { display:flex; align-items:center; gap:5px; max-width:260px; padding:2px 0; font-size:10px; color:#616161; }
    .question-index a:hover { color:#171717; text-decoration:underline; text-underline-offset:3px; }
    .question-index b { font:9px var(--mono); color:#737373; }.question-index span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .analysis { padding:20px 28px; border-bottom:1px solid var(--line); }
    .section-label { float:left; margin:2px 9px 0 0; border:1px solid #dedede; border-radius:4px; padding:1px 5px; color:#737373; font:9px/1.9 var(--mono); }
    h2 { margin:0 0 10px; font-size:16px; font-weight:600; line-height:1.7; overflow-wrap:anywhere; }
    h3 { margin:0 0 5px; font-size:11px; font-weight:550; color:#525252; }
    .analysis > h3 { display:none; }
    .conclusion { font-size:12px; color:#525252; margin:0 0 12px; line-height:1.85; }
    .panel { border:1px solid #e2e2e2; border-radius:6px; overflow:hidden; background:#fff; }
    .panel.has-chart { display:grid; grid-template-columns:minmax(0,1.05fr) minmax(0,1fr); grid-template-rows:auto 1fr auto; }
    figure { margin:0; padding:12px 12px 8px; border-bottom:1px solid #ededed; min-width:0; }
    .has-chart > figure { grid-column:1; grid-row:1 / 3; border-bottom:0; border-right:1px solid #ededed; }
    iframe { display:block; width:100%; height:225px; border:0; background:white; }
    figcaption { margin-top:5px; font-size:9px; color:#737373; }
    .data-heading { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:10px 14px 8px; }
    .data-heading h3 { margin:0; font-size:10px; }.data-count { font-size:9px; color:#737373; }
    .has-chart > .data-heading { grid-column:2; grid-row:1; }
    .table-scroll { max-height:270px; overflow:auto; scrollbar-width:thin; min-width:0; }
    .has-chart > .table-scroll { grid-column:2; grid-row:2; }
    table { width:100%; border-collapse:collapse; text-align:left; font-size:11px; font-variant-numeric:tabular-nums; }
    th,td { padding:9px 14px; white-space:nowrap; border-bottom:1px solid #f0f0f0; }
    th { position:sticky; top:0; background:#fafafa; color:#737373; font-size:10px; font-weight:450; }
    td { color:#404040; }tbody tr:last-child td { border:0; }tbody tr:hover { background:#fafafa; }
    .numeric { font-family:var(--mono); font-size:10px; }
    .empty { margin:0; padding:12px 14px; color:#737373; font-size:11px; }
    details { border-top:1px solid #ededed; background:#fcfcfc; }.has-chart > details { grid-column:1 / -1; grid-row:3; }
    summary { cursor:pointer; font-size:10px; color:#737373; padding:9px 14px; }summary:hover { color:#171717; background:#f8f8f8; }
    .sql-meta { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:0 14px 10px; font-size:10px; color:#737373; }
    .copy { padding:3px 8px; font-size:10px; }
    pre { margin:0; padding:14px; overflow:auto; background:#f5f5f5; color:#404040; font:11px/1.8 var(--mono); tab-size:2; }code { font:inherit; }
    .sql-token-keyword { color:#0550ae; font-weight:600; }
    .sql-token-function { color:#8250df; }
    .sql-token-string { color:#116329; }
    .sql-token-number { color:#953800; }
    .sql-token-comment { color:#6e7781; font-style:italic; }
    .sql-token-identifier { color:#57606a; }
    .query-id { margin:0; padding:10px 14px; font:9px/1.7 var(--mono); color:#737373; overflow-wrap:anywhere; }
    .notice { padding:10px 12px; margin:10px 0; border:1px solid #e2e2e2; border-radius:5px; background:#f5f5f5; color:#616161; font-size:11px; }#truncation { margin:14px 28px; }
    .sources { padding:20px 28px; background:#fcfcfc; }.sources h2 { margin:0 0 12px; font-size:15px; }
    .source-grid { display:grid; grid-template-columns:1fr 2fr; gap:26px; }ul { padding-left:16px; margin:0; font-size:11px; color:#737373; }li+li { margin-top:3px; }.source-grid li { overflow-wrap:anywhere; }
    .limitations { margin-top:16px; padding-top:12px; border-top:1px solid var(--line); }.limitations ul { font-size:10px; }
    footer { display:flex; justify-content:center; align-items:center; gap:7px; border-top:1px solid var(--line); padding:18px 28px; color:#737373; font-size:11px; background:#fcfcfc; }
    .antv-brand { display:inline-flex; align-items:center; gap:4px; color:#404040; font-size:11px; font-weight:500; line-height:1; }.antv-brand img { display:block; width:14px; height:auto; }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }[hidden] { display:none!important; }
    #status { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:#171717; color:#fff; border-radius:6px; font-size:12px; padding:8px 14px; opacity:0; pointer-events:none; }#status.visible { opacity:1; }
    @media(max-width:760px) {
      main { margin:0; border:0; box-shadow:none; }.report-intro { padding:20px 16px 14px; }h1 { font-size:21px; }.summary { font-size:12px; }.meta { font-size:9px; }
      .overview { margin:0 16px; padding-bottom:14px; }.metrics { grid-template-columns:repeat(2,minmax(0,1fr)); }.metric { padding:10px 14px; border-bottom:1px solid var(--line); }.metric:nth-child(2n) { border-right:0; }.metric:last-child { border-bottom:0; }.metric:nth-last-child(2):nth-child(2n+1) { border-bottom:0; }.metric-value { font-size:23px; }
      .report-index { gap:10px; }.question-index { gap:3px 10px; }.question-index a { font-size:9px; max-width:100%; }
      .analysis { padding:18px 16px; }h2 { font-size:15px; }.conclusion { font-size:12px; }.panel.has-chart { display:block; }.has-chart > figure { border-right:0; border-bottom:1px solid #ededed; }iframe { height:220px; }
      .source-grid { grid-template-columns:1fr; gap:14px; }.sources { padding:18px 16px; }footer { padding:12px 16px; }#truncation { margin-inline:16px; }
    }
    @media(prefers-reduced-motion:reduce) { html { scroll-behavior:auto; } }
    @media print {
      .copy,#status,.skip,.report-index { display:none; }body { background:white; }main { max-width:none; margin:0; border:0; box-shadow:none; }.report-intro,.analysis,.sources { padding:16px 0; }.overview { margin:0; }.table-scroll { max-height:none; overflow:visible; }
      .analysis,.sources { break-inside:avoid; }.sql:not([open]) { display:none; }iframe { height:220px; }
    }
  </style>
</head>

  <!-- Repeated content has a fixed structure. Every report value is bound with textContent. -->
  <template id="metric-template">
    <div class="metric"><div class="metric-label" data-field="label"></div><div class="metric-value"><span data-field="value"></span><span class="metric-unit" data-field="unit"></span></div><div class="metric-note" data-field="note"></div></div>
  </template>
  <template id="section-template">
    <section class="analysis">
      <div class="section-label" data-field="number"></div>
      <h2 data-field="question"></h2>
      <h3>结论</h3><p class="conclusion" data-field="conclusion"></p>
      <p class="notice truncated" hidden>结果已截断：下方数据不完整，请勿据此推断全量结果。</p>
      <div class="panel">
        <figure hidden><iframe sandbox="allow-scripts"></iframe><figcaption>图表与结果表使用同一次查询的数据</figcaption></figure>
        <p class="notice chart-error" hidden></p>
        <div class="data-heading"><h3>结果数据</h3><span class="data-count" data-field="count"></span></div>
        <div class="table-scroll" tabindex="0" role="region"><table><caption class="sr-only"></caption><thead><tr></tr></thead><tbody></tbody></table><p class="empty" hidden>查询未返回数据。</p></div>
        <details class="sql">
          <summary>SQL · 查看查询与执行记录</summary>
          <div class="sql-meta"><span data-field="source"></span><button type="button" class="copy">复制 SQL</button></div>
          <pre><code data-field="sql"></code></pre><p class="query-id" data-field="queryMeta"></p>
        </details>
      </div>
    </section>
  </template>
  <div id="status" role="status" aria-live="polite"></div>
  <!-- ARTIFACT_DATA -->
  <script>
    const report = JSON.parse(document.getElementById('artifact-data').textContent);
    const queries = new Map(report.queries.map(query => [query.queryId, query]));
    const format = value => value == null ? '—' : typeof value === 'number'
      ? new Intl.NumberFormat('zh-CN', { maximumFractionDigits:6 }).format(value)
      : typeof value === 'object' ? JSON.stringify(value) : String(value);
    const bind = (root, fields) => root.querySelectorAll('[data-field]').forEach(node => { node.textContent = fields[node.dataset.field] ?? ''; });
    const list = (id, items) => items.forEach(value => { const item = document.createElement('li'); item.textContent = value; document.getElementById(id).append(item); });
    const clone = id => document.getElementById(id).content.firstElementChild.cloneNode(true);
    // shortcut: common SQL tokens, not a full dialect parser; use a bundled lexer if dialect support expands.
    function sqlTokens(sql) {
      const keywords = new Set('SELECT FROM WHERE WITH AS AND OR NOT IN IS NULL TRUE FALSE CASE WHEN THEN ELSE END GROUP BY ORDER HAVING LIMIT OFFSET JOIN LEFT RIGHT INNER OUTER FULL CROSS ON UNION ALL DISTINCT ASC DESC OVER PARTITION ROWS RANGE BETWEEN UNBOUNDED PRECEDING FOLLOWING CURRENT ROW FILTER QUALIFY EXCEPT INTERSECT VALUES CAST TRY_CAST DATE TIMESTAMP INTERVAL LIKE ILIKE EXISTS NULLS FIRST LAST'.split(' '));
      const pattern = /(?<comment>--[^\r\n]*|\/\*[\s\S]*?\*\/)|(?<string>'(?:''|[^'])*'|\$\$[\s\S]*?\$\$|\$(?<tag>[A-Za-z_]\w*)\$[\s\S]*?\$\k<tag>\$)|(?<identifier>"(?:""|[^"])*")|(?<number>(?:\b\d+(?:\.\d*)?|\.\d+)(?:[eE][+-]?\d+)?)|(?<word>\b[A-Za-z_]\w*\b)/g;
      const tokens = [];
      let offset = 0;
      for (const match of sql.matchAll(pattern)) {
        if (match.index > offset) tokens.push({ text:sql.slice(offset, match.index) });
        const text = match[0], end = match.index + text.length, groups = match.groups;
        const type = ['comment','string','identifier','number'].find(name => groups[name] !== undefined)
          || (keywords.has(text.toUpperCase()) ? 'keyword' : /^\s*\(/.test(sql.slice(end)) ? 'function' : undefined);
        tokens.push({ text, type }); offset = end;
      }
      if (offset < sql.length) tokens.push({ text:sql.slice(offset) });
      return tokens;
    }
    function highlightSQL(code, sql) {
      const fragment = document.createDocumentFragment();
      for (const { text, type } of sqlTokens(sql)) {
        const token = type ? document.createElement('span') : document.createTextNode(text);
        if (type) { token.className = 'sql-token-' + type; token.textContent = text; }
        fragment.append(token);
      }
      code.replaceChildren(fragment);
    }
    const stamp = new Intl.DateTimeFormat('zh-CN', { timeZone:'Asia/Shanghai', dateStyle:'medium', timeStyle:'short' }).format(new Date(report.generatedAt));
    document.title = report.title + ' · AVA';
    bind(document.getElementById('main'), { title:report.title, summary:report.summary, meta:stamp + ' · 上海时间 · ' + report.sections.length + ' 个问题 · ' + report.queries.length + ' 次查询' });
    document.getElementById('truncation').hidden = !report.queries.some(query => query.result.truncated);
    document.getElementById('metrics').hidden = !report.metrics.length;
    report.metrics.forEach(metric => {
      const query = queries.get(metric.queryId);
      const node = clone('metric-template');
      bind(node, { label:metric.label, value:format(Number(query.result.data[metric.rowIndex][metric.field])), unit:metric.unit, note:query.result.truncated ? '执行结果 · 已截断' : '取自执行结果' });
      document.getElementById('metrics').append(node);
    });
    report.sections.forEach((section, index) => {
      const query = queries.get(section.queryId);
      const node = clone('section-template');
      node.id = 'analysis-' + (index + 1);
      const item = document.createElement('li');
      const link = document.createElement('a'); link.href = '#' + node.id; link.title = section.question;
      const badge = document.createElement('b'); badge.textContent = String(index + 1).padStart(2, '0');
      const label = document.createElement('span'); label.textContent = section.question;
      link.append(badge, label); item.append(link); document.getElementById('question-index').append(item);
      const columns = query.result.schema.map(column => column.name);
      bind(node, { number:'问题 ' + (index + 1), question:section.question, conclusion:section.conclusion, source:'来源：' + query.source + ' · DuckDB SQL', sql:query.sql,
        count:query.result.data.length + ' 行 · ' + columns.length + ' 列', queryMeta:query.queryId + ' · ' + query.executedAt });
      highlightSQL(node.querySelector('[data-field="sql"]'), query.sql);
      node.querySelector('h2').id = 'heading-' + (index + 1);
      node.setAttribute('aria-labelledby', 'heading-' + (index + 1));
      node.querySelector('.truncated').hidden = !query.result.truncated;
      node.querySelector('.table-scroll').setAttribute('aria-label', section.question + ' — 查询结果');
      node.querySelector('caption').textContent = section.question + '的结果数据';
      columns.forEach(name => { const cell = document.createElement('th'); cell.scope = 'col'; cell.textContent = name; node.querySelector('thead tr').append(cell); });
      query.result.data.forEach(row => {
        const tr = document.createElement('tr');
        columns.forEach(name => { const cell = document.createElement('td'); cell.textContent = format(row[name]); if (typeof row[name] === 'number') cell.className = 'numeric'; tr.append(cell); });
        node.querySelector('tbody').append(tr);
      });
      node.querySelector('.empty').hidden = query.result.data.length > 0;
      const chart = report.charts.find(chart => chart.section === index + 1);
      if (chart) {
        node.querySelector('.panel').classList.add('has-chart');
        const frame = node.querySelector('iframe');
        frame.title = section.question + ' — 交互图表'; frame.srcdoc = chart.html; node.querySelector('figure').hidden = false;
        // GPT-Vis measures its container at mount; remount after a real width change.
        let width = 0;
        new ResizeObserver(entries => {
          const next = entries[0].contentRect.width;
          if (width && Math.abs(next - width) > 1) frame.srcdoc = chart.html;
          width = next;
        }).observe(frame);
      }
      const error = report.chartErrors.find(error => error.section === index + 1);
      if (error) { node.querySelector('.chart-error').hidden = false; node.querySelector('.chart-error').textContent = '图表暂不可用：' + error.message + ' 结果表与 SQL 已保留。'; }
      node.querySelector('.copy').addEventListener('click', async () => {
        try { await navigator.clipboard.writeText(query.sql); notify('SQL 已复制'); }
        catch { notify('复制未成功，请展开 SQL 后手动选择复制'); }
      });
      document.getElementById('sections').append(node);
    });
    list('sources', [...new Set(report.queries.map(query => query.source))]);
    list('definitions', report.definitions.length ? report.definitions : ['以各章节展示的 SQL 为准；未额外声明业务口径。']);
    list('limitations', [...report.limitations, '报告内嵌的是查询结果，不包含原始文件的全部明细。', '正文、数据与 SQL 可离线查看；交互图表需要联网加载 GPT-Vis。']);
    let toastTimer;
    function notify(message) { const status = document.getElementById('status'); status.textContent = message; status.classList.add('visible'); clearTimeout(toastTimer); toastTimer = setTimeout(() => status.classList.remove('visible'), 2400); }
  </script>
</body>
</html>
